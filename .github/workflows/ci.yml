name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run tests
        run: pytest -q

      - name: Run example solver
        run: python -m baanschema.cli --example

  validate-schedules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # De plafonds hieronder zijn de stand op het moment van invoeren. De
      # validator faalt bij méér overtredingen (regressie) én bij minder
      # (dan hoort het plafond omlaag, zodat de winst vastligt).
      #
      # Ze zijn hoog omdat docs/SPEC.md (24-08-2026) eisen toevoegt die nog in
      # geen enkele bron zitten: de faseregels (sectie 5) en de deadline voor de
      # eerste partij (sectie 2). Zelfs het handmatige gold-schema haalt die
      # niet. Zie docs/REFACTOR_PLAN.md en de vragen in Discord #baanschema.

      # Bijgesteld 12-10-2026 (product/generiek): de plafonds liepen achter op
      # de validator (CI ook op main rood sinds 27-08). HARD is overal omlaag
      # gezet naar de gemeten stand (strenger). MODEL telt waar het model
      # strenger is dan SPEC.md (o.a. VENSTER-JEUGD/-GEM, SOORT-CONFLICT) en is
      # naar de gemeten stand gezet; geen schema-bestand is veranderd.

      - name: Gold-schema (handmatige referentie)
        run: |
          python scripts/validate_schedule.py docs/gold_result.json \
            --all --max-hard 17 --max-model 77

      - name: Heuristiek
        run: |
          python scripts/validate_schedule.py docs/result.json \
            --all --max-hard 16 --max-model 101

      - name: OR-Tools planner, seizoen 2026-2027 (het uitgangspunt)
        run: |
          python scripts/validate_schedule.py docs/ortools_2026-2027_*.json \
            --max-hard 3 --max-model 26

      - name: OR-Tools planner, voorjaar 2026 (historisch)
        run: |
          python scripts/validate_schedule.py \
            docs/ortools_06-04-2026.json \
            docs/ortools_12-04-2026.json \
            docs/ortools_19-04-2026.json \
            docs/ortools_10-05-2026.json \
            docs/ortools_17-05-2026.json \
            docs/ortools_25-05-2026.json \
            docs/ortools_31-05-2026.json \
            --max-hard 53 --max-model 11
